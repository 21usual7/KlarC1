<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121410">
<meta name="robots" content="noindex">
<title>Нет подключения — Klar C1</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8f3;--paper:#fffefa;--ink:#263c31;--muted:#637063;--green:#315b45;--line:#dfe5d8;--mark:#f2f2dc;--btn-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121410;--paper:#1a1d16;--ink:#c1d0c9;--muted:#8f9c8f;--green:#acc0b5;--line:#2d3326;--mark:#2a2a20;--btn-ink:#121410}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
main{width:100%;max-width:440px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:32px 26px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:Manrope,system-ui,Arial,sans-serif;font-size:26px;font-weight:800;letter-spacing:-1px;margin-bottom:22px}
.brand-mark{display:grid;place-items:center;width:30px;height:36px;background:var(--green);color:var(--mark);border-radius:12px 4px 12px 4px}
.brand-c1{font-size:16px;font-weight:500;margin-left:-4px;color:var(--muted)}
h1{font-family:Manrope,system-ui,Arial,sans-serif;font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.5px;margin:0 0 10px}
p{margin:0 0 22px;color:var(--muted)}
button{font:inherit;font-weight:500;min-height:48px;padding:12px 26px;border:0;border-radius:7px;background:var(--green);color:var(--btn-ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #8ea975;outline-offset:4px}
small{display:block;margin-top:18px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="brand" aria-label="Klar C1"><span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>Klar<span class="brand-c1">C1</span></div>
  <h1>Нет подключения к интернету</h1>
  <p>Страница не загрузилась. Klar C1 сохраняет прогресс на сервере, поэтому для занятий нужна сеть. Проверь подключение и попробуй ещё раз.</p>
  <button type="button" id="retry">Повторить</button>
  <small>Страница откроется сама, когда связь вернётся.</small>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
